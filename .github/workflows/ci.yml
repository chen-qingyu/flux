name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: xmake-io/github-action-setup-xmake@v1
      - name: Configure
        run: xmake f -m release -y
      - name: Build
        run: xmake build
      - name: Run tests
        run: xmake run test
      - name: CLI smoke
        run: xmake run cli data/demo.bpmn
